[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eip-phase0"
version = "0.2.0"
description = "Electrical Intelligence Platform (EIP V2) - Phase 0 Vector Ladder Compiler & Formal Verifier"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
    "pydantic>=1.10,<3.0",
    "PyYAML>=6.0",
    "shapely>=2.0.0",
    "pdfplumber>=0.10.0",
    "pypdfium2>=4.0.0",
    "sympy>=1.12",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
local-pro = [
    "pymupdf>=1.24.0",
    "z3-solver>=4.12.0",
    "networkx>=3.2",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
